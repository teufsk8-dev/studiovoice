[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memebot"
version = "0.1.0"
description = "Robinhood Chain memecoin monitor with gated Jev decisions and a guarded executor"
requires-python = ">=3.10"
dependencies = ["web3>=7,<8", "rich>=13", "python-dotenv>=1.0"]

[project.scripts]
memebot = "memebot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
